name: Prepare OP15 KSU888a SUSFS NoDroid branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Create validated OP15 branch (no kernel build)
    runs-on: ubuntu-latest
